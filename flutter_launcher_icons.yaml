flutter_launcher_icons:
  # Source: "two roofs" (two people sharing one home), drawn in code from
  # assets/icon/app_icon.svg (Nov 2026).
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 30

  # Adaptive icon (Android 8+): the mark alone over the warm off-white gradient
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 16

  # iOS: no transparency allowed; full-bleed square
  ios: true
  image_path_ios: "assets/icon/app_icon_ios.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#F7F4EE"
    theme_color: "#2E6B4F"
